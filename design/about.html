<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方案说明 · 庭院之间</title><style>body{max-width:850px;margin:40px auto;padding:20px;background:#eee9e0;color:#393129;font:16px/1.8 sans-serif}a{color:#72583a}</style><h1>庭院之间 · 全屋空间整合63</h1><p>这是一套用于沟通空间氛围、材质和家具关系的AI摄影效果方案，包含客厅、餐厨、玄关、卧室、书房及庭院等视角。</p><p>书房保留南墙衣柜，目前按书房兼备用客房使用；未来儿童房按1.5×2米床垫试排。柜色与天然石纹为效果意向，尚未对应具体实物色号。</p><p>摄影效果图与原可编辑模型分开维护；局部造型和几何可能存在差异，通道、柜门开启、家具外尺寸与施工节点以原模型和现场复尺为准。卫浴及洗烘区尚未单独完成摄影精修。</p><p><a href="index.html">全屋效果总览</a> · <a href="flex-room.html">书房与儿童房转换</a> · <a href="../">原2D/3D可编辑模型</a></p></html>
