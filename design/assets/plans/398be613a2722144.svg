<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="#ebe5db" /><g font-family="Microsoft YaHei, sans-serif"><text x="45" y="45" font-size="25" fill="#39342e">南墙衣柜保留 · 书房 / 儿童房转换草案</text><text x="45" y="75" font-size="13" fill="#6f665b">模型房间约2995×3442mm；衣柜沿南墙。新家具为试排，尺寸需现场复核。</text><text x="80" y="110" font-size="18">现在 · 书房兼备用客房</text><text x="620" y="110" font-size="18">以后 · 儿童房</text><g transform="translate(80,125)"><rect x="0.0" y="0.0" width="419.30000000000007" height="481.88000000000005" rx="0" fill="#f5f0e7" stroke="#675e54" stroke-width="1.4" /><rect x="82.18" y="-3.08" width="255.64000000000001" height="6.16" rx="0" fill="#b8d6d9" stroke="#65888e" stroke-width="1.4" /><text x="343" y="-18.200000000000003" text-anchor="middle" font-size="15" fill="#39342e">北 ↑ · 原窗</text><rect x="6.580000000000001" y="397.88000000000005" width="252.00000000000003" height="84.00000000000001" rx="0" fill="#b8a183" stroke="#786e61" stroke-width="1.4" /><text x="132.58" y="434.00000000000006" text-anchor="middle" font-size="14" fill="#39342e">南墙原衣柜 · 保留</text><text x="132.58" y="459.20000000000005" text-anchor="middle" font-size="11" fill="#39342e">约1800 × 600 / 推拉门</text><path d="M270.76000000000005 481.88000000000005H395.08000000000004" stroke="#f5f0e7" stroke-width="4" /><path d="M395.08000000000004 481.88000000000005V357.56000000000006 M270.76000000000005 481.88000000000005A124.32000000000001 124.32000000000001 0 0 1 395.08000000000004 357.56000000000006" fill="none" stroke="#8e8579" stroke-width="1.2" stroke-dasharray="5 3" /><text x="334.6" y="469.00000000000006" text-anchor="middle" font-size="12" fill="#39342e">原门</text><rect x="14.000000000000002" y="14.000000000000002" width="224.00000000000003" height="105.00000000000001" rx="12" fill="#d8d4c7" stroke="#786e61" stroke-width="1.4" /><text x="126.00000000000001" y="72.80000000000001" text-anchor="middle" font-size="13" fill="#39342e">北侧沙发床</text><rect x="0.0" y="133.0" width="35.0" height="217.00000000000003" rx="0" fill="#a68b68" stroke="#786e61" stroke-width="1.4" /><text x="98.00000000000001" y="245.00000000000003" text-anchor="middle" font-size="12" fill="#39342e">西墙可拆书柜</text><rect x="210.42" y="133.14000000000001" width="91" height="168.00000000000003" rx="14" fill="#c8b38f" stroke="#786e61" stroke-width="1.4" /><text x="256.20000000000005" y="207.20000000000002" text-anchor="middle" font-size="12" fill="#39342e">独立</text><text x="256.20000000000005" y="231.00000000000003" text-anchor="middle" font-size="12" fill="#39342e">1200×650</text><rect x="134.12" y="177.8" width="75.60000000000001" height="72.80000000000001" rx="12" fill="#c5bba9" stroke="#786e61" stroke-width="1.4" /><text x="-19.6" y="240.8" text-anchor="middle" font-size="15" fill="#39342e">西</text><text x="439.6" y="240.8" text-anchor="middle" font-size="15" fill="#39342e">东</text><text x="209.72000000000003" y="511.00000000000006" text-anchor="middle" font-size="14" fill="#39342e">南 · 衣柜位置两阶段均不变</text></g><g transform="translate(620,125)"><rect x="0.0" y="0.0" width="419.30000000000007" height="481.88000000000005" rx="0" fill="#f5f0e7" stroke="#675e54" stroke-width="1.4" /><rect x="82.18" y="-3.08" width="255.64000000000001" height="6.16" rx="0" fill="#b8d6d9" stroke="#65888e" stroke-width="1.4" /><text x="343" y="-18.200000000000003" text-anchor="middle" font-size="15" fill="#39342e">北 ↑ · 原窗</text><rect x="6.580000000000001" y="397.88000000000005" width="252.00000000000003" height="84.00000000000001" rx="0" fill="#b8a183" stroke="#786e61" stroke-width="1.4" /><text x="132.58" y="434.00000000000006" text-anchor="middle" font-size="14" fill="#39342e">南墙原衣柜 · 保留</text><text x="132.58" y="459.20000000000005" text-anchor="middle" font-size="11" fill="#39342e">约1800 × 600 / 推拉门</text><path d="M270.76000000000005 481.88000000000005H395.08000000000004" stroke="#f5f0e7" stroke-width="4" /><path d="M395.08000000000004 481.88000000000005V357.560000