<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>庭院之间 · 全屋全景漫游</title><link rel="stylesheet" href="vendor/pannellum.css"><style>
*{box-sizing:border-box}body{margin:0;background:#292723;color:#fff;font:15px system-ui,"Microsoft YaHei",sans-serif}#panorama{position:fixed;inset:0}header{position:fixed;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:10}.brand,.controls,footer{background:#272621d9;backdrop-filter:blur(14px);border:1px solid #ffffff25;border-radius:14px;box-shadow:0 8px 30px #0002;pointer-events:auto}.brand{padding:13px 18px}.brand small{display:block;letter-spacing:3px;color:#e3d6c1;font-size:10px}.brand h1{font-size:18px;font-weight:500;margin:5px 0 0}.controls{display:flex;gap:8px;padding:8px}button,select{font:inherit;border:1px solid #ffffff30;color:#fff;background:#ffffff0c;border-radius:8px;padding:9px 12px;cursor:pointer}select{max-width:200px}option,optgroup{background:#35322c}button:hover{background:#ffffff25}button:focus-visible,select:focus-visible{outline:2px solid #edc996;outline-offset:2px}footer{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 16px;max-width:94vw;z-index:10;text-align:center;width:max-content}.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.hint{font-size:11px;color:#ddd1be;margin-top:9px}#loading{position:fixed;inset:0;display:grid;place-content:center;background:#292723f0;z-index:20;text-align:center;gap:15px}#loading[hidden]{display:none}#loading button{width:max-content;margin:auto}#info{position:fixed;inset:0;background:#0008;z-index:30;display:grid;place-items:center}#info[hidden]{display:none}.card{background:#f4efe6;color:#37332d;border-radius:18px;padding:28px;max-width:480px;margin:20px;line-height:1.8}.card button{background:#554a3b;color:white}.pnlm-controls-container{top:100px!important}.pnlm-about-msg{display:none!important}@media(max-width:650px){header{top:10px;left:10px;right:10px}.brand{padding:10px}.brand h1{font-size:14px}.brand small{font-size:8px}.controls{padding:5px;gap:4px}button,select{padding:8px;font-size:12px}select{max-width:130px}.controls #fullscreen{display:none}footer{bottom:14px;padding:10px;width:94vw}.hint{font-size:10px}}
</style></head><body><div id="panorama"></div><header><div class="brand"><small>庭院之间 · 360°</small><h1 id="title">门外玄关</h1></div><div class="controls"><select id="rooms" aria-label="选择空间"></select><button id="quality" aria-label="切换画质">高清</button><button id="fullscreen" aria-label="全屏">全屏</button><button id="about" aria-label="说明">说明</button></div></header><footer><div class="links" id="links"></div><div class="hint"><button id="back" style="padding:3px 8px;margin-right:8px" disabled>返回上一空间</button>拖动环顾 · 滚轮缩放 · 下方切换相邻空间 <span id="count"></span></div></footer><div id="loading"><div id="status">正在载入玄关…</div><button id="retry" hidden>重新加载</button></div><div id="info" hidden><div class="card"><h2>全屋全景漫游</h2><p>26个视点，覆盖玄关、客餐厅、厨房、卧室、卫浴及庭院。支持触屏拖动和全屏浏览。</p><p>本版为模型底图经 AI 精修的设计可视化，并非实景拍摄。高清模式为7096×3548的 AI 增强全景，流畅模式为3548×1774；源图1774×887，非原生8K。局部顶面、接缝及造型仍有生成痕迹。细节为设计表达，施工尺寸以模型和复尺为准。</p><p>编辑模型与渲染页面分开保存。</p><p><a href="storyboard.html" target="_blank" style="color:#65533c">查看空间脚本与漫游分镜</a></p><button id="close">返回漫游</button></div></div><script src="vendor/pannellum.js"></script><script src="nodes.js"></script><script>
let useHD=innerWidth>650,hdSupported=true;
try {const c=document.createElement('canvas'),gl=c.getContext('webgl');if(gl){hdSupported=gl.getParameter(gl.MAX_TEXTURE_SIZE)>=7096;if(!hdSupported)useHD=false;gl.getExtension('WEBGL_lose_context')?.loseContext();}} catch(e) {useHD=false;hdSupported=false}
const nodes=window.TOUR_NODES,byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const $=s=>document.getElementById(s),cache=new Map();let viewer=null,current=null,requested=null,token=0,pending=new Map();const visited=[];let returning=false;
const groups=[['入户与餐厨',['entry','entrance','dining','kitchen-door','kitchen']],['客厅与书房',['living-north','living','desk','hall','study']],['主卧套房',['master-door','closet','master','master-window','master-bath']],['父母房',['parents','parents-vanity','parents-bath']],['盥洗与家政',['wash','bath','laundry']],['庭院',['garden-door','garden-center','garden-dining','garden-lounge','garden-border']]];
for(const [title,ids] of groups){const g=document.createElement('optgroup');g.label=title;for(const id of ids){const o=document.createElement('option');o.value=id;o.textContent=byId[id].title;g.append(o)}$('rooms').append(g)}
window.receivePanorama=(id,data)=>{const p=pending.get(id);if(p){p.resolve(data);pending.delete(id)}};
function source(id){
 id+=useHD?'':'-mobile';
 if(location.protocol!=='file:')return Promise.resolve('assets/'+id+'.jpg');
 if(cache.has(id))return Promise.resolve(cache.get(id));
 if(pending.has(id))return pending.get(id).promise;
 let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b});
 const script=document.createElement('script');
 const cleanup=()=>{clearTimeout(timer);script.remove();pending.delete(id)};
 const fail=()=>{cleanup();reject(Error('图片读取失败'))};
 const timer=setTimeout(fail,30000);
 pending.set(id,{promise,resolve:data=>{cleanup();cache.set(id,data);while(cache.size>3)cache.delete(cache.keys().next().value);resolve(data)}});
 script.src='assets/'+id+'.js';script.onerror=fail;document.head.append(script);return promise;
}
async function go(id){if(!byId[id])id='entry';const seq=++token;requested=id;$('loading').hidden=false;$('retry').hidden=true;$('status').textContent='正在载入 · '+byId[id].title;try{const panorama=await source(id);if(seq!==token)return;viewer?.destroy();viewer=pannellum.viewer('panorama',{type:'equirectangular',panorama,autoLoad:true,hfov:95,minHfov:65,maxHfov:115,pitch:byId[id].view.pitch,yaw:byId[id].view.yaw,showControls:true,showFullscreenCtrl:false,compass:false,keyboardZoom:true,mouseZoom:true,strings:{loadingLabel:'正在加载全景',bylineLabel:'',noWebGLError:'当前浏览器无法显示全景，请开启硬件加速后重试。'}});window.tourViewer=viewer;viewer.on('load',()=>{if(seq!==token)return;if(current&&current!==id&&!returning)visited.push(current);returning=false;current=id;window.currentScene=id;$('back').disabled=!visited.length;$('loading').hidden=true;$('title').textContent=byId[id].title;$('rooms').value=id;$('count').textContent=(nodes.findIndex(n=>n.id===id)+1)+' / '+nodes.length;$('links').replaceChildren();for(const target of byId[id].links){const b=document.createElement('button');b.textContent='前往 '+byId[target].title;b.onclick=()=>go(target);$('links').append(b)}history.replaceState(null,'','#'+id)});viewer.on('error',message=>{if(seq===token)failure(message)});}catch(e){if(seq===token)failure(e.message)}}
function failure(message){$('status').textContent='加载未完成，请重试。';$('retry').hidden=false;console.error('Panorama:',message)}
$('rooms').onchange=e=>go(e.target.value);$('retry').onclick=()=>go(requested||'entry');$('fullscreen').onclick=()=>viewer?.toggleFullscreen();$('about').onclick=()=>{$('info').hidden=false};$('close').onclick=()=>{$('info').hidden=true};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('info').hidden=true});window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==current)go(id)});$('back').onclick=()=>{const id=visited.pop();if(id){window.stopTourGuide?.();returning=true;go(id)}};$('quality').textContent=useHD?'高清':'流畅';$('quality').disabled=!hdSupported;$('quality').onclick=()=>{useHD=!useHD;$('quality').textContent=useHD?'高清':'流畅';go(current||'entry')};window.goScene=go;go(location.hash.slice(1)||'entry');
</script><script src="tour-guide.js"></script></body></html>
